baseURL = "https://mbok.mochipool.com/"
languageCode = "en-us"
title = "Mochi's Body of Knowledge"
theme = "hugo-bearblog"

# Generate a nice robots.txt for SEO
enableRobotsTXT = true

# https://github.com/gohugoio/hugo/issues/12152
capitalizeListTitles = false

# Generate "Bearblog"-like URLs !only!, see https://bearblog.dev/.
disableKinds = ["taxonomy"]
# ignoreErrors = ["error-disable-taxonomy"]
[taxonomies]
tag = "tags"

[permalinks]
blog = "/:slug/"
tags = "/blog/:slug"

[params]
title = "Mochi's Body of Knowledge"
description = "Mochi's Online Knowledge Base"
favicon = "images/favicon.png"
dateFormat = "2006-01-02"
hideMadeWithLine = true
hideRSSLink = true

[params.author]
name = "Reza Rajan"
email = "reza@mochipool.com"

[[menu.main]]
name = "Guides"
pageRef = "/guides"
weight = 10
[[menu.main]]
name = "Concepts"
pageRef = "/concepts"
weight = 20

[services.rss]
limit = 42

[pagination]
pagerSize = 16

[outputs]
# Generate RSS for home only.
section = ["html"]
taxonomy = ["html"]
term = ["html"]

# This section ensures that internal links are automatically resolved to a Hugo-compatible
# version
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true
[markup.goldmark.renderHooks]
[markup.goldmark.renderHooks.link]
enableDefault = true
[markup.tableOfContents]
startLevel = 2
endLevel = 3
[markup.highlight]
lineNos = true
lineNumbersInTable = false
noClasses = true
style = "catppuccin-mocha"

# For GitHub Actions
[caches]
  [caches.images]
    dir = ':cacheDir/images'
